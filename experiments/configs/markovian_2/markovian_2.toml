name = "markovian_2"

[run]
seed = 42
T = 2000
n = 10

[env_params]
environment = "markovian_2"
reward_node = "Y"
atomic = true
include_empty = false

[env_params.uniform]
x_values =  [0, 1, 2]
z_values =  [0, 1, 2]
y_values =  [0, 1]

[env_params.change_params]
mode = "controlled"
variables = ["Y", "Y", "Y"]
updates = [
    "2 * v['Z'] - v['X'] + u['U_Y'] >= 3",
    "2 * v['X'] - v['Z'] + u['U_Y'] >= 3",
    "2 * v['Z'] - v['X'] + u['U_Y'] >= 3",
]
every = 500

[agents]
names = ["SR-UCB"]

[agents_params]
c = 1.41421356237
delta = 0.001
lambda = 30.0
min_samples_for_detection = 30
atomic = true
gamma = 0.0005

[output]