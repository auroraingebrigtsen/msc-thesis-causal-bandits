name = "markovian_2"

[run]
seed = 42
T = 2500
n = 10

[env_params]
environment = "markovian_2"
reward_node = "Y"
atomic = true
include_empty = false

[env_params.uniform]
x_values =  [0, 1, 2]
z_values =  [0, 1, 2]
y_values =  [0, 1]

[env_params.change_params]
mode = "controlled"
variables = ["Y", "Y", "Y"]
updates = [
    "2 * v['Z'] - v['X'] + u['U_Y'] >= 3",
    "2 * v['X'] - v['Z'] + u['U_Y'] >= 3",
    "2 * v['Z'] - v['X'] + u['U_Y'] >= 3",
    "2 * v['Z'] - v['X'] + u['U_Y'] >= 3",
]
every = 500

[agents]
names = [ "PHT-UCB-sr"]

[agents_params]
c = 1.41421356237
atomic = true
seed = 42

[agents_params.variable_monitoring]
delta = 0.01
lambda = 35.0
min_samples_for_detection = 30

[agents_params.arm_monitoring]
delta = 0.005
lambda = 20.0
min_samples_for_detection = 30
alpha = 0.0
seed = 42