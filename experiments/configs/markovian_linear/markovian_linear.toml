name = "markovian_linear_interval"

[run]
seed = 42
T = 2000
n = 1

[env_params]
environment = "markovian_linear"
reward_node = "Y"
atomic = true
include_empty = false
x_lower = 1
x_upper = 3
z_lower = 1
z_upper = 3
y_lower = 0
y_upper = 10

[env_params.weights.X]
U_X = 1.0

[env_params.weights.Z]
U_Z = 1.0

[env_params.weights.Y]
X = 1
Z = 2
U_Y = 1

[env_params.schedule]
type = "controlled_linear_mechanism_change_schedule"
variables = ["Y", "Y", "Y"]
every = 500

[[env_params.schedule.new_weights]]
X = 2
Z = 1
U_Y = 1

[[env_params.schedule.new_weights]]
X = 1
Z = 2
U_Y = 1

[[env_params.schedule.new_weights]]
X = 2
Z = 1
U_Y = 1

[agents]
names = [ "UCB", "PHT-UCB-global", "PHT-UCB-arm", "SR-UCB", "RBOCPD-UCB-global", "RBOCPD-UCB-arm", "RBOCPD-SR-UCB"]

[agents_params]
c = 1.41421356237
delta = 0.005
lambda = 20.0
min_samples_for_detection = 30
atomic = true
gamma = 0.0005

[output]