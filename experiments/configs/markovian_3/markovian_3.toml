name = "markovian_3"

[run]
seed = 42
T = 2000
n = 10

[env_params]
environment = "markovian_3"
reward_node = "Y"
atomic = true
include_empty = false
p_t = 0.6#0.6
p_b = 0.1
p_g = 0.7
p_y = 0.9

[env_params.change_params]
mode = "controlled"
variables = ["U_B", "U_B", "U_B"]
updates = [0.9, 0.1, 0.9]
every = 500

[agents]
names = ["UCB", "PHT-UCB-local", "PHT-UCB-global", "PHT-UCB-sr"]

[agents_params]
c = 1.41421356237
atomic = true
seed = 42

[agents_params.variable_monitoring]
delta = 0.005
lambda = 20.0
min_samples_for_detection = 30

[agents_params.arm_monitoring]
delta = 0.005
lambda = 20.0
min_samples_for_detection = 30
alpha = 0.0
seed = 42

 