name = "markovian_large_changes"

[run]
seed = 42
T = 10000
n = 1000

[env_params]
environment = "markovian"
reward_node = "Y"
atomic = true
include_empty = false
p_x = 0.1
p_z = 0.7
p_y = 0.9

[env_params.change_params]
mode = "controlled"
variables = ["U_X", "U_X", "U_X", "U_X"]
updates = [0.9, 0.1, 0.9, 0.1]
every = 2000

[agents]
names = ["POMIS-UCB", "PHT-UCB-local", "PHT-UCB-global", "PHT-UCB-sr"]

[agents_params]
c = 1.41421356237
atomic = true
seed = 42

[agents_params.variable_monitoring]
delta = 0.1
lambda = 15.0
min_samples_for_detection = 30

[agents_params.arm_monitoring]
delta = 0.1
lambda = 9.0
min_samples_for_detection = 30
alpha = 0.00
seed = 42

 