name = "markovian_medium_changes"

[run]
seed = 42
T = 2000
n = 100

[env_params]
environment = "markovian"
reward_node = "Y"
atomic = true
include_empty = false
p_x = 0.5
p_z = 0.7
p_y = 0.9

[env_params.schedule]
type = "controlled"
# X=0 er alltid 0.34
# X=1 er alltid 0.66
# Z=0 starter 0.5-> t:500 0.25 t:1000 0.5
# Z=1 starter 0.5 -> t:500 0.74 t:1000 0.5
exogenous = ["U_X", "U_X", "U_X"]
new_params = [0.8, 0.5, 0.8]
every = 500

[agents]
names = ["UCB", "PHT-UCB-global", "PHT-UCB-arm", "SR-UCB"]

[agents_params]
c = 1.41421356237
delta = 0.005
lambda = 20.0
min_samples_for_detection = 30
atomic = true

[output]