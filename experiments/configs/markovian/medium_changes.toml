name = "markovian_medium_changes"

[run]
seed = 42
T = 2000
n = 100

[env_params]
environment = "markovian"
reward_node = "Y"
atomic = true
include_empty = false
p_x = 0.6
p_z = 0.7
p_y = 0.9

[env_params.change_params]
mode = "controlled"
variables = ["U_X", "U_X", "U_X"]
updates = [0.9, 0.6, 0.9]
every = 500

[agents]
names = ["UCB", "RBOCPD-UCB-global", "RBOCPD-UCB-local", "RBOCPD-SR-UCB", "SR-UCB-Oracle", "UCB-Oracle-local", "UCB-Oracle-global"]

[agents_params]
c = 1.41421356237
atomic = true
gamma = 0.0005

[output]