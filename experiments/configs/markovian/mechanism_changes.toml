name = "markovian_mechanism_changes"

[run]
seed = 42
T = 2000
n = 100

[env_params]
environment = "markovian"
reward_node = "Y"
atomic = true
include_empty = false
p_x = 0.1#0.6
p_z = 0.7
p_y = 0.9

[env_params.change_params]
mode = "controlled"
variables = ["Y", "Y", "Y"]
updates= [
    "1 ^ v['X'] ^ v['Z'] ^ u['U_Y']",
    "v['X'] ^ v['Z'] ^ u['U_Y']",
    "1 ^ v['X'] ^ v['Z'] ^ u['U_Y']",
]
every = 500

[agents]
names = ["UCB", "RBOCPD-UCB-global", "RBOCPD-UCB-arm", "RBOCPD-SR-UCB"]

[agents_params]
c = 1.41421356237
atomic = true
gamma = 0.0005

[output]