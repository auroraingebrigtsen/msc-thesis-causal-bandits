name = "markovian_small_changes"

[run]
seed = 42
T = 2000
n = 100

[env_params]
environment = "markovian"
reward_node = "Y"
atomic = true
include_empty = false
p_x = 0.6
p_z = 0.7
p_y = 0.9

[env_params.schedule]
type = "controlled_shift_schedule"
variables = ["U_X", "U_X", "U_X"]
# Initially do(X=1) is optimal
# Same at 500
# 1000 do(Z=1) is slighyly better than do(X=1)
# 1500 do(Z=1) is becomes a bit more better than do(X=1)


new_params = [0.66, 0.72, 0.78]
every = 500

[agents]
names = ["UCB", "PHT-UCB-global", "PHT-UCB-arm", "SR-UCB"]

[agents_params]
c = 1.41421356237
delta = 0.005
lambda = 20.0
min_samples_for_detection = 30
atomic = true

[output]