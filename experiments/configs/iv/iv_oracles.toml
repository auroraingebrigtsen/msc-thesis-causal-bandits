name = "iv_oracles"

[run]
seed = 42
T = 2500
n = 10

[env_params]
environment = "iv"
reward_node = "Y"
atomic = false
include_empty = false
p_x = 0.1
p_z =0.7
p_y =  0.9
p_zy = 0.9

[env_params.change_params]
mode = "controlled"
# First change:  changes from optimal arm from do(X=1) to do(Z=1)
# Second change: Does nothing - nothing is resat - nothing is affected
# Third change: changes from optimal arm from do(Z=1) to do(X=1)
# Fourth change: changes from optimal arm from do(X=1) to do(X=0) (it is no fourth change lol but it is Y 0.2 -> 0.6
variables = ['U_ZY', 'U_ZY', 'U_ZY', 'U_ZY']
updates = [0.1, 0.9, 0.1, 0.9]
every = 500

[agents]
names = ["PHT-UCB-global", "PHT-UCB-sr", "UCB-oracle-global", "UCB-oracle-sr"]

[agents_params]
c = 1.41421356237
atomic = false
seed = 42

[agents_params.variable_monitoring]
delta = 0.01
lambda = 17.0
min_samples_for_detection = 30

[agents_params.arm_monitoring]
delta = 0.01
lambda = 18.0
min_samples_for_detection = 30
alpha = 0.0
seed = 42

 