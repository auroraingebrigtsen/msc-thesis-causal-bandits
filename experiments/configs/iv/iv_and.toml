name = "iv_and"

[run]
seed = 42
T = 2000
n = 100

[env_params]
environment = "iv"
reward_node = "Y"
atomic = false
include_empty = false
p_x = 0.1
p_z =0.7
p_y =  0.9
p_zy = 0.1
mechanism = "and"

[env_params.schedule]
type = "controlled_shift_schedule"
# First change:  changes from optimal arm from do(X=1) to do(Z=1)
# Second change: Does nothing - nothing is resat - nothing is affected
# Third change: changes from optimal arm from do(Z=1) to do(X=1)
# Fourth change: changes from optimal arm from do(X=1) to do(X=0) (it is no fourth change lol but it is Y 0.2 -> 0.6
variables = ['U_ZY', 'U_ZY', 'U_ZY', 'U_ZY', 'U_ZY', 'U_ZY', 'U_ZY', 'U_ZY', 'U_ZY', 'U_ZY'] 
new_params = [0.9, 0.1, 0.9, 0.1, 0.9, 0.1, 0.1, 0.9, 0.1, 0.9]
every = 200

[agents]
names = [ "POMIS-UCB", "PHT-UCB-global", "PHT-UCB-arm", "SR-UCB"]

[agents_params]
c = 1.41421356237
delta = 0.005
lambda = 8.0
min_samples_for_detection = 30
atomic = false

[output]