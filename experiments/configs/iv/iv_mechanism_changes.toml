name = "iv_mechanism_changes"

[run]
seed = 42
T = 10000
n = 1000

[env_params]
environment = "iv"
reward_node = "Y"
atomic = false
include_empty = false
p_x = 0.7
p_z =0.6
p_y =  0.9
p_zy = 0.4

[env_params.change_params]
mode = "controlled"

variables = ['Z', 'Z', 'Z', 'Z']
updates = [
    "v['X'] ^ u['U_ZY'] ^ u['U_Z']",
    "v['X'] ^ u['U_ZY'] & u['U_Z']",
    "v['X'] ^ u['U_ZY'] ^ u['U_Z']",
    "v['X'] ^ u['U_ZY'] & u['U_Z']",
]
every = 2000

[agents]
names = ["POMIS-UCB", "PHT-UCB-local", "PHT-UCB-global","PHT-UCB-sr", "UCB-oracle-global"]

[agents_params]
c = 1.41421356237
atomic = false
seed = 42

[agents_params.variable_monitoring]
delta = 0.1
lambda = 20.0
min_samples_for_detection = 30

[agents_params.arm_monitoring]
delta = 0.1
lambda = 11.0
min_samples_for_detection = 30
alpha = 0.0
seed = 42

 