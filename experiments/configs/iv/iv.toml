name = "iv"

[run]
seed = 42
T = 2500
n = 1000

[env_params]
environment = "iv"
reward_node = "Y"
atomic = false
include_empty = false
p_x = 0.1
p_z =0.7
p_y =  0.9
p_zy = 0.9

[env_params.change_params]
mode = "controlled"
variables = ['U_ZY', 'U_ZY', 'U_ZY', 'U_ZY']
updates = [0.1, 0.9, 0.1, 0.9]
every = 500

[agents]
names = ["POMIS-UCB", "PHT-UCB-local", "PHT-UCB-global", "PHT-UCB-sr"]

[agents_params]
c = 1.41421356237
atomic = false
seed = 42

[agents_params.variable_monitoring]
delta = 0.01
lambda = 17.0
min_samples_for_detection = 30

[agents_params.arm_monitoring]
delta = 0.01
lambda = 18.0
min_samples_for_detection = 30
alpha = 0.0
seed = 42

 