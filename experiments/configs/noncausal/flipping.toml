name = "flipping_noncausal"

[run]
seed = 42
T = 5000
n = 100

[env_params]
environment = "noncausal"
reward_node = "Y"
atomic = true
include_empty = false
p_0 = 0.5 # Probability of Y=1 when X=0
p_1 = 0.3  # Probability of Y=1 when X=1

[env_params.change_params]
mode = "controlled"
variables = ["U_1", "U_1"]
updates = [0.8, 0.4]
every = 2000

[agents]
names = ["UCB", "PHT-UCB-global", "PHT-UCB-arm", "SR-UCB"]

[agents_params]
c = 1.41421356237
delta = 0.1
lambda = 50.0
min_samples_for_detection = 100
atomic = true

[output]