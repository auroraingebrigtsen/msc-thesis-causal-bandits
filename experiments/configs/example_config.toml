name = "test_experiment"

[run]
seed = 42
T = 2000
n = 100

[env_params]
environment = "markovian"
reward_node = "Y"
atomic = true
include_empty = false
p_x = 0.1
p_z = 0.7
p_y = 0.9

[env_params.change_params]
mode = "controlled"
variables = ["U_X", "U_X", "U_X"]
updates = [0.9, 0.1, 0.9]
every = 500

[agents]
names = ["UCB", "PHT-UCB-global", "PHT-UCB-arm", "SR-UCB"]

[agents_params]
c = 1.41421356237
delta = 0.005
lambda = 20.0
min_samples_for_detection = 30
atomic = true

[output]