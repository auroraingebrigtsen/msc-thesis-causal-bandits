name = "test_experiment"

[run]
seed = 42
T = 2000
n = 100

[env_params]
environment = "markovian"
reward_node = "Y"
atomic = true
include_empty = false
p_x = 0.1
p_z = 0.7
p_y = 0.9

[env_params.change_params]
mode = "controlled"
variables = ["U_X", "U_X", "U_X"]
updates = [0.9, 0.1, 0.9]
every = 500

[agents]
names = ["UCB", "PHT-UCB-global", "PHT-UCB-local", "SR-UCB"]

[agents_params]
c = 1.41421356237
atomic = true
delta = 0.005
lambda = 20.0
min_samples_for_detection = 30
alpha = 0.099
gamma = 0.0001
seed = 42

[output]
plots_path = "plots/test_experiment/"
results_path = "results/test_experiment/"