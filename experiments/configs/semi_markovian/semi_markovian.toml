name = "semi_markovian"

[run]
seed = 42
T = 2000
n = 10

[env_params]
environment = "semi_markovian"
reward_node = "Y"
atomic = false
include_empty = false
p_s = 0.1
p_t = 0.65
p_w = 0.1
p_x = 0.75
p_z =0.9
p_y =  0.1
p_zy = 0.65

[env_params.schedule]
type = "controlled_schedule"
variables = ['X', 'X', 'X']
update = [
    "1 ^ (u['U_X']  & v['T']) ^ v['Z']",
    "(u['U_X']  & v['T']) ^ v['Z']",
    "1 ^ (u['U_X']  & v['T']) ^ v['Z']",
]
every = 500

[agents]
names = [ "SR-UCB-Oracle", "POMIS-UCB", "RBOCPD-SR-UCB"]

[agents_params]
c = 1.41421356237
delta = 0.005
lambda = 20.0
min_samples_for_detection = 30
atomic = false
gamma = 0.0001

[output]