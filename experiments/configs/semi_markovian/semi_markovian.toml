name = "semi_markovian"

[run]
seed = 42
T = 10000
n = 1000

[env_params]
environment = "semi_markovian"
reward_node = "Y"
atomic = false
include_empty = false
p_s = 0.9
p_t = 0.85
p_w = 0.4
p_x = 0.9
p_z =0.88
p_y =  0.9
p_wt=0.9
p_zy = 0.61

[env_params.change_params]
mode = "controlled"
variables = ['X', 'X', 'X', 'X']
updates = [
    "1 ^ (u['U_X']  & v['T']) ^ v['Z']",
    "(u['U_X']  & v['T']) ^ v['Z']",
    "1 ^ (u['U_X']  & v['T']) ^ v['Z']",
    "(u['U_X']  & v['T']) ^ v['Z']",
]
every = 2000

[agents]
names = ["POMIS-UCB", "PHT-UCB-sr"]

[agents_params]
c = 1.41421356237 
atomic = false
seed = 42

[agents_params.variable_monitoring]
delta = 0.1
lambda = 30.0
min_samples_for_detection = 30

[agents_params.arm_monitoring]
delta = 0.1
lambda = 10.0
min_samples_for_detection = 30
alpha = 0.0
seed = 42
 