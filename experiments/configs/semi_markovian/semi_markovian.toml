name = "semi_markovian"

[run]
seed = 42
T = 2000
n = 100

[env_params]
environment = "semi_markovian"
reward_node = "Y"
atomic = false
include_empty = false
p_s = 0.45
p_t = 0.81
p_w = 0.07
p_x = 0.06
p_z =0.05
p_y =  0.06
p_wx = 0.51
p_zy = 0.54

[env_params.schedule]
type = "controlled_shift_schedule"
variables = ['U_WX', 'U_WX', 'U_WX']
new_params = [0.65, 0.31, 0.9]
every = 500

[agents]
names = ["POMIS-UCB", "PHT-UCB-global", "PHT-UCB-arm", "SR-UCB"]

[agents_params]
c = 1.41421356237
delta = 0.005
lambda = 20.0
min_samples_for_detection = 30
atomic = false

[output]